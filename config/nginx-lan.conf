map $http_upgrade $lan_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name dwarf.local;

    # Docker DNS is re-resolved when the game container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_backend dwarf-fortress:6080;

    # Serve the admin wrapper even when updating an older noVNC image.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://$admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name client.dwarf.local;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $player_backend dwarf-fortress:8765;

    location / {
        proxy_pass http://$player_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
